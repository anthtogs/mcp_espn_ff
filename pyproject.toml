[project]
name = "mcp-espn-ff"
version = "0.2.0"
description = "ESPN fantasy football MCP server for stdio and remote Streamable HTTP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "espn-api>=0.46.0,<0.47",
    "mcp[cli]>=2.0.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
